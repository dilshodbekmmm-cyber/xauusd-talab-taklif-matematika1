name: Windows EXE build

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller o'rnatish
        run: python -m pip install --upgrade pip pyinstaller

      - name: EXE yaratish
        run: pyinstaller --onefile --windowed --name XAUUSD-Calculator main.py

      - name: EXE ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Calculator-Windows
          path: dist/XAUUSD-Calculator.exe
